apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shoveler Auth Portal on the tiger cluster, osgdev namespace (tiger-osg-config's
# development instance), served at shoveler-auth.osgdev.chtc.io by osgdev's own
# Traefik (128.105.82.131); cert-manager letsencrypt-prod and Ceph storage.
# Follows the conventions of tiger-osg-config's os-registry.
#
# Prerequisites in the namespace (both sealed in tiger-osg-config):
#   - Secret shoveler-auth-oidc-secret (client.id / client.secret): the
#     portal's CILogon client, created by the CILogon/COmanage admin.
#   - Secret shoveler-auth-signing-key (private.pem): the RSA key RabbitMQ
#     already trusts, which signs access tokens (see signing-key.yaml).
# The session secret is generated by the portal on its volume.
#
# Deploy: let Flux apply it from tiger-osg-config (see the README), or for a
# quick test with write access:
#   kubectl --context dweitzel2-tiger-dex apply -k k8s/overlays/tiger
namespace: osgdev # the host's *.osgdev.chtc.io resolves to this namespace's Traefik

resources:
  - ../../base

images:
  - name: ghcr.io/djw8605/shoveler-auth-portal
    newTag: "0.2.0" # a released tag (git tag v0.2.0 publishes :0.2.0)

# Non-secret settings, visible in git. A change here rolls the Deployment
# (kustomize adds a content hash to the ConfigMap name).
configMapGenerator:
  - name: shoveler-auth-portal-config
    envs:
      - config.env

patches:
  - path: host.yaml
  - path: signing-key.yaml
  - target:
      kind: PersistentVolumeClaim
      name: shoveler-auth-portal-data
    patch: |-
      # Replicated Ceph NVMe on raddus, as tiger's databases use (the older
      # non-raddus classes are being migrated away from).
      - op: add
        path: /spec/storageClassName
        value: 3x-replica-nvme-raddus
