# Example Ingress with TLS. Adjust the host, ingressClassName and issuer to
# your cluster. HTTPS is required: the session cookie is Secure, and RabbitMQ
# and the shovelers reach /token and /.well-known/jwks.json over https.
#
# The host must match PORTAL_BASE_URL (and normally TOKEN_ISSUER) in the Secret,
# and <PORTAL_BASE_URL>/auth/callback must be registered with CILogon.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoveler-auth-portal
  labels:
    app: shoveler-auth-portal
  annotations:
    # If you use cert-manager; otherwise create the TLS Secret yourself.
    cert-manager.io/cluster-issuer: REPLACE_ME
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shoveler-auth.osg.example
      secretName: shoveler-auth-portal-tls
  rules:
    - host: shoveler-auth.osg.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shoveler-auth-portal
                port:
                  name: http
