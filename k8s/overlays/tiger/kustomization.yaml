apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shoveler Auth Portal on the tiger cluster (osg namespace; Traefik ingress,
# cert-manager letsencrypt-prod, Ceph storage, sealed-secrets), following the
# conventions of tiger-osg-config's os-registry.
#
# Before the first deploy:
#   1. Edit host.yaml and config.env (host, RESOURCE_SERVER_ID, SCOPE_VALUE, ...).
#   2. Seal the secret:  cp secret.env.example secret.env  (fill it in), then
#        ./seal-secret.sh /path/to/tiger-osg-config/tiger-cert.pem
#      which writes sealed-secret.yaml (safe to commit; secret.env is gitignored).
#   3. kubectl --context dweitzel2-tiger-dex apply -k k8s/overlays/tiger
#      (or let Flux apply it from tiger-osg-config; see the README).
namespace: osg

resources:
  - ../../base
  - sealed-secret.yaml # generated by seal-secret.sh

images:
  - name: ghcr.io/djw8605/shoveler-auth-portal
    newTag: "0.1.0" # a released tag (git tag v0.1.0 publishes :0.1.0)

# Non-secret settings, visible in git. A change here rolls the Deployment
# (kustomize adds a content hash to the ConfigMap name).
configMapGenerator:
  - name: shoveler-auth-portal-config
    envs:
      - config.env

patches:
  - path: host.yaml
  - target:
      kind: PersistentVolumeClaim
      name: shoveler-auth-portal-data
    patch: |-
      # Replicated Ceph NVMe on raddus, as tiger's databases use (the older
      # non-raddus classes are being migrated away from).
      - op: add
        path: /spec/storageClassName
        value: 3x-replica-nvme-raddus
