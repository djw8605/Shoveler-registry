apiVersion: batch/v1
kind: CronJob
metadata:
  name: shoveler-auth-idle-expiry
  labels:
    app: shoveler-auth-portal
spec:
  # Run nightly. Disables credentials idle for >= IDLE_DAYS (default 30).
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Give up if the pod can't schedule (e.g. portal pod down) so a stuck
      # run doesn't block later ones under concurrencyPolicy: Forbid.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          # The data PVC is ReadWriteOnce, so this pod must run on the same
          # node as the portal pod or it will hang on Multi-Attach. Do NOT give
          # this pod the app=shoveler-auth-portal label: the Service and the
          # Deployment select on it.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: shoveler-auth-portal
                  topologyKey: kubernetes.io/hostname
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            fsGroup: 10001
          containers:
            - name: expire
              # Pin a released tag (pushing git tag v0.1.0 publishes :0.1.0) rather
              # than :latest; keep the Deployment and CronJob on the same tag.
              image: ghcr.io/djw8605/shoveler-auth-portal:0.1.0
              command: ["python", "-m", "portal.expire"]
              envFrom:
                - secretRef:
                    name: shoveler-auth-portal
              env:
                - name: DB_PATH
                  value: /data/portal.db
                - name: SIGNING_KEY_DIR
                  value: /data/keys
              volumeMounts:
                - name: data
                  mountPath: /data
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            # Must be the SAME volume the Deployment writes to (the shared DB).
            - name: data
              persistentVolumeClaim:
                claimName: shoveler-auth-portal-data
