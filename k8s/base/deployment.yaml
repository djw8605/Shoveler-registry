apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoveler-auth-portal
  labels:
    app: shoveler-auth-portal
spec:
  replicas: 1 # SQLite + on-disk keys + in-process rate limits: a single writer only.
  # Stop the old pod before starting the new one: the data PVC is
  # ReadWriteOnce (a rolling update can stall on Multi-Attach if the new pod
  # lands on another node), and SQLite must never have two writers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shoveler-auth-portal
  template:
    metadata:
      labels:
        app: shoveler-auth-portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: portal
          # The overlay pins the tag (kustomize images:).
          image: ghcr.io/djw8605/shoveler-auth-portal
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: shoveler-auth-portal-config
          env:
            # The portal's own CILogon client, from a Secret with keys
            # client.id / client.secret (created by the CILogon/COmanage admin).
            - name: CILOGON_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: shoveler-auth-oidc-secret
                  key: client.id
            - name: CILOGON_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shoveler-auth-oidc-secret
                  key: client.secret
            # SESSION_SECRET is not set: the portal generates one on first
            # start and keeps it on the data volume beside its signing keys.
            - name: DB_PATH
              value: /data/portal.db
            - name: SIGNING_KEY_DIR
              value: /data/keys
            # uvicorn --proxy-headers only trusts 127.0.0.1 by default, so
            # X-Forwarded-For from the ingress controller would be ignored and
            # the per-IP /register rate limit would see only the ingress pod.
            # The NetworkPolicy admits only Traefik, so trusting any peer is OK.
            - name: FORWARDED_ALLOW_IPS
              value: "*"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        # Persists the SQLite DB and signing keys across restarts.
        - name: data
          persistentVolumeClaim:
            claimName: shoveler-auth-portal-data
