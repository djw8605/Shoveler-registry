# The portal's public DNS name. Keep it in sync with PORTAL_BASE_URL and
# TOKEN_ISSUER in config.env, and register https://<host>/auth/callback with
# CILogon.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shoveler-auth-portal
spec:
  rules:
    - host: shoveler-auth.osgdev.chtc.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shoveler-auth-portal
                port:
                  name: http
  tls:
    - hosts:
        - shoveler-auth.osgdev.chtc.io
      secretName: shoveler-auth-portal-certs
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shoveler-auth-portal
spec:
  dnsNames:
    - shoveler-auth.osgdev.chtc.io
