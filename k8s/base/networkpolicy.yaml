# Only the Traefik ingress may reach the portal. Egress stays open: the portal
# calls CILogon (OIDC discovery, token and JWKS endpoints) at login.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shoveler-auth-portal
spec:
  podSelector:
    matchLabels:
      app: shoveler-auth-portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
